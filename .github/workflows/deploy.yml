name: Deploy Hendy Server PRO V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hendy-server-pro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run checks
        run: |
          npm run lint
          npm test
          node scripts/check-config.mjs

      - name: Validate Cloudflare deployment inputs
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub variable CLOUDFLARE_ACCOUNT_ID"; exit 1)
          test -n "$D1_DATABASE_ID" || (echo "Missing GitHub variable D1_DATABASE_ID"; exit 1)
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const id = process.env.D1_DATABASE_ID;
            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) throw new Error("D1_DATABASE_ID must be a UUID");
            const path = "wrangler.toml";
            const content = readFileSync(path, "utf8").replace("00000000-0000-0000-0000-000000000000", id);
            if (content.includes("00000000-0000-0000-0000-000000000000")) throw new Error("D1 placeholder was not replaced");
            writeFileSync(path, content);
          '

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
