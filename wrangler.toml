name = "hendy-server-pro"
main = "src/index.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_ENV = "production"
ADMIN_IDS = "8639286417"
MEDIA_ALLOWED_HOSTS = "youtube.com,youtu.be,tiktok.com,facebook.com,fb.watch"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "hendy-server-pro-db"
# Replace this zero UUID with the database_id returned by:
# npx wrangler d1 create hendy-server-pro-db
database_id = "e4c36ee9-97fe-4d2a-a837-9147fe423d77"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "BOT_SOCKET"
class_name = "BotSocket"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotSocket"]

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "hendy-server-pro-jobs"

[[queues.consumers]]
queue = "hendy-server-pro-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "hendy-server-pro-dlq"
retry_delay = 30

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "hendy-server-pro-assets"
